services:
  frontend:
    build:
      context: ./frontend

    container_name: aihexa-frontend-compose

    ports:
      - "${APP_PORT}:80"

    environment:
      APP_ENV: ${APP_ENV}
      APP_MESSAGE: ${APP_MESSAGE}
      SECRET_KEY: ${SECRET_KEY}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s